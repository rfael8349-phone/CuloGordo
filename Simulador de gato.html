<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Simulador de gato</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#fdf3e4;--fg:#4a3320;--card:#fff8ee;--bar:#e8d5bb;--acc:#e8873a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1812;--fg:#f3e6d3;--card:#2a221a;--bar:#443726;--acc:#f0a15c}}
:root[data-theme="dark"]{--bg:#1d1812;--fg:#f3e6d3;--card:#2a221a;--bar:#443726;--acc:#f0a15c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;user-select:none;-webkit-user-select:none;touch-action:manipulation}
h1{font-size:1.2rem;margin:14px 0 2px}
.sub{font-size:.8rem;opacity:.7;margin-bottom:8px}
#stage{position:relative;width:min(88vw,340px);border-radius:22px;overflow:hidden;background:var(--card);box-shadow:0 6px 24px #0003;cursor:pointer;touch-action:none}
#cat{display:block;width:100%;height:auto;pointer-events:none;transform-origin:50% 100%}
.tilt{animation:tilt .6s}.squish{animation:squish .5s}.jump{animation:jump .6s}.wig{animation:wig .5s}.lick{animation:lick .8s}
@keyframes tilt{30%{transform:rotate(-3deg) scale(1.02)}60%{transform:rotate(2deg)}}
@keyframes squish{40%{transform:scale(1.04,.96)}}
@keyframes jump{30%{transform:translateY(-4%) scale(1.02)}60%{transform:translateY(0) scale(1.03,.97)}}
@keyframes wig{20%{transform:rotate(-2deg)}40%{transform:rotate(2deg)}60%{transform:rotate(-1.5deg)}80%{transform:rotate(1deg)}}
@keyframes lick{25%{transform:scale(1.03) translateX(-1%)}50%{transform:scale(1.03) translateX(1%)}}
#bubble{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#fff;color:#4a3320;padding:8px 14px;border-radius:16px;font-size:.95rem;font-weight:600;box-shadow:0 2px 10px #0003;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center;z-index:3}
#bubble.on{opacity:1}
.fx{position:absolute;font-size:26px;pointer-events:none;animation:up 1.2s ease-out forwards;z-index:2}
@keyframes up{to{transform:translateY(-90px) scale(1.4);opacity:0}}
#ui{width:min(88vw,340px);margin:12px 0 18px}
.row{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:.85rem}
.row b{width:74px;font-weight:600}
.bar{flex:1;height:12px;background:var(--bar);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;width:50%;background:var(--acc);border-radius:8px;transition:width .4s}
.btns{display:flex;gap:8px;margin-top:10px}
button{flex:1;padding:10px 6px;font-size:.95rem;border:0;border-radius:12px;background:var(--acc);color:#fff;font-weight:600;cursor:pointer}
button:active{transform:scale(.96)}
.hint{font-size:.75rem;opacity:.65;text-align:center;margin-top:10px}
</style></head><body>

<script>
const $=s=>document.querySelector(s),cat=$('#cat'),st=$('#stage'),bub=$('#bubble');
let love=40,hunger=35,ctx=null,purr=null,bt;
const say=(t)=>{bub.textContent=t;bub.classList.add('on');clearTimeout(bt);bt=setTimeout(()=>bub.classList.remove('on'),1800)};
const anim=c=>{cat.classList.remove('tilt','squish','jump','wig','lick');void cat.offsetWidth;cat.classList.add(c)};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function fx(e,x,y){const s=document.createElement('span');s.className='fx';s.textContent=e;s.style.left=x+'px';s.style.top=y+'px';st.appendChild(s);setTimeout(()=>s.remove(),1200)}
function upd(){love=Math.max(0,Math.min(100,love));hunger=Math.max(0,Math.min(100,hunger));$('#b1').style.width=love+'%';$('#b2').style.width=(100-hunger)+'%'}
function ac(){if(!ctx){try{ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ctx&&ctx.state==='suspended')ctx.resume();return ctx}
function meow(p=1){const c=ac();if(!c)return;const t=c.currentTime,o=c.createOscillator(),f=c.createBiquadFilter(),g=c.createGain();
o.type='sawtooth';o.frequency.setValueAtTime(420*p,t);o.frequency.linearRampToValueAtTime(820*p,t+.2);o.frequency.linearRampToValueAtTime(480*p,t+.6);
f.type='bandpass';f.frequency.setValueAtTime(900,t);f.frequency.linearRampToValueAtTime(1800,t+.25);f.frequency.linearRampToValueAtTime(900,t+.6);f.Q.value=3;
g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.35,t+.08);g.gain.linearRampToValueAtTime(0,t+.65);
o.connect(f);f.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.7)}
function startPurr(){const c=ac();if(!c||purr)return;const o=c.createOscillator(),l=c.createOscillator(),lg=c.createGain(),g=c.createGain(),f=c.createBiquadFilter();
o.type='sawtooth';o.frequency.value=26;l.frequency.value=6;lg.gain.value=.25;f.type='lowpass';f.frequency.value=260;g.gain.value=.0;
l.connect(lg);lg.connect(g.gain);o.connect(f);f.connect(g);g.connect(c.destination);g.gain.setTargetAtTime(.3,c.currentTime,.2);o.start();l.start();purr={o,l,g}}
function stopPurr(){if(!purr)return;const c=ctx,p=purr;purr=null;p.g.gain.setTargetAtTime(0,c.currentTime,.15);setTimeout(()=>{p.o.stop();p.l.stop()},500)}
let hold=null;
st.addEventListener('pointerdown',e=>{
 const r=st.getBoundingClientRect(),x=(e.clientX-r.left),y=(e.clientY-r.top),fx_=x/r.width,fy=y/r.height;ac();
 let zone;
 if(fx_<.3&&fy>.27&&fy<.4)zone='nose';else if(fy<.4&&fx_<.65)zone='head';else if(fy>.8&&fx_<.75)zone='paw';else if(fx_>.62&&fy<.7||fy<.2)zone='bg';else zone='body';
 if(zone==='nose'){say('¡Bluuup! 👅');anim('lick');fx('👅',x,y);love+=4;meow(1.3)}
 else if(zone==='head'){say(rnd(['Mrrr… 😌','Ahí, ahí… 💕','Más, por favor']));anim('tilt');fx('💕',x,y);love+=5;hold='purr'}
 else if(zone==='body'){if(hunger>75&&Math.random()<.5){say('¡Tengo hambre! 🍗');meow(.9);anim('jump')}else{say(rnd(['Prrrr… 😻','Qué rico','Mmm, sigue']));anim('squish');fx('💗',x,y);love+=4;hold='purr'}}
 else if(zone==='paw'){say(rnd(['¡Eh! Mis patitas 🐾','Jeje, cosquillas','¡Miau!']));anim('wig');fx('🐾',x,y);meow(1.1);love+=2}
 else{say(rnd(['¿Qué miras? 👀','Hay algo por ahí…','Miau?']));anim('wig');meow(1);fx('❓',x,y)}
 if(hold==='purr')startPurr();upd()});
['pointerup','pointercancel','pointerleave'].forEach(n=>st.addEventListener(n,()=>{hold=null;stopPurr()}));
