const w=wand&&wand.on;if(w){const dy=wand.fy+8-wand.ly,dx=wand.fx-wand.lx;wand.lx+=dx*.14;wand.ly+=dy*.14;wand.v=Math.abs(dx)+Math.abs(dy)}
const tg=w?wand.lx:(ball&&!ball.held?ball.x:null);if(tg===null||!aiOn||!['idle','walk','happy'].includes(c.state))return;
const ty=w?wand.ly:ball.y,mv=w?wand.v>3:Math.abs(ball.vx)+Math.abs(ball.vy)>.4;
c.lk=Math.max(-3,Math.min(3,(tg-c.x)/5))*c.fl;
if(tick%8===0&&(mv||Math.abs(tg-c.x)>14)){c.goal={x:Math.max(28,Math.min(50,tg)),then:null};c.spd=mv?1.5:.8;c.state='walk'}
if(Math.abs(tg-c.x)<13&&ty>(w?60:112)&&(mv||rnd()<.02)&&tick-c.lastPounce>50){c.lastPounce=tick;c.state='pounce';c.timer=22;chirp()}}
function toyDraw(){if(ball){const x=Math.round(ball.x),y=Math.round(ball.y),cols=[["#e0384e","#ff8fa0","#a31d33"],["#3d9ee8","#bdeaff","#174f8a"],["#e8c34a","#fff0a0","#9a6b16"],["#7b49b5","#d8b5ff","#45236e"],["#55a85b","#b8ef9b","#27632d"]][toyI];f("#4a2410",x-4,y-4,8,8);f(cols[0],x-3,y-3,6,6);f(cols[1],x-2,y-2,3,1);f(cols[2],x-1,y+1,3,1);f(cols[1],x+1,y-1,1,3)
if(wand&&wand.on){for(let i=0;i<12;i++)f('#8a5a2a',wand.fx+i*.7,wand.fy-i*1.6,2,2);for(let i=0;i<=8;i++){const t=i/8;f('#fff',wand.fx+(wand.lx-wand.fx)*t,wand.fy+(wand.ly-wand.fy)*t+Math.sin(t*Math.PI)*4,1,1)}f('#ff5a7a',wand.lx-2,wand.ly,5,3);f('#ffd23a',wand.lx-1,wand.ly-2,3,2)}}}
const per={play:.7+rnd()*.3,cuddle:.9,lazy:.6,curious:.5+rnd()*.4},last={};
function think(){const c=cat,n=night(),now=Date.now(),sc={},toy=(ball&&!ball.held)||(wand&&wand.on);
sc.eat=bowl?(100-S.food)/100*1.6:(S.food<50?.2:0);sc.litter=(100-S.litter)/100*1.4;sc.sleep=((100-S.energy)/100+(n?.9:0))*per.lazy;
sc.play=(toy?1.6:.1)*per.play*(S.energy/100+.3);sc.cuddle=(100-S.love)/100*per.cuddle*(now-c.lastTouch>20000?1:.25);
sc.groom=(100-S.clean)/100*.9;sc.explore=.35*per.curious;sc.zoom=.12*per.play*(S.energy/100);
let best='explore',bs=-1;for(const k in sc){const v=sc[k]*(last[k]&&now-last[k]<12000?.35:1)*(.7+rnd()*.6);if(v>bs){bs=v;best=k}}last[best]=now;
({eat:()=>bowl?goto(29,'eat'):ask('🍗'),litter:()=>S.litter<70&&goto(50,'litter'),sleep:()=>goto(38,'sleep'),play:()=>toy?0:ask('🧶'),cuddle:()=>{ask('💗');goto(38,null)},groom:()=>{c.state='groom';c.timer=110},explore:idleDo,zoom:()=>{say('💨',40);goto(28+rnd()*22,null,1.8)}})[best]()}
function idleDo(){const c=cat,q=rnd();
if(q<.2){c.lk=rnd()<.5?-2.5:2.5;setTimeout(()=>c.lk=0,2500)}
else if(q<.35){const z=rnd()<.25;if(z)say('💨',40);goto(28+rnd()*22,null,z?1.8:.6)}
else if(q<.5){c.state='groom';c.timer=110}else if(q<.6){c.state='yawn';c.timer=50}
else if(q<.7){c.state='stretch';c.timer=60}else if(q<.78){c.state='roll';c.timer=70}
else{c.fl=-c.fl;say('👀',50)}}
function step(){if(!A)return;tick++;const c=cat;if(c.bub>0)c.bub--;
P=P.filter(p=>{p.y+=p.vy;return--p.l>0});
if(c.state==='walk'){const g=c.goal,dx=g.x-c.x;if(Math.abs(dx)<=c.spd+.3){c.x=g.x;arrive(g.then)}else{c.x+=Math.sign(dx)*c.spd;c.fl=dx<0?1:-1}}
else if(TS.includes(c.state)){if(c.state==='flehmen'&&tick%20===0)add(c.x-c.fl*24,YB-88*cur.sy+26,'s',-.2);if(c.state==='knead'&&tick%60===0)purr();
if(c.state==='eat'&&tick%15===0)beep(300,.05,.06,100);if(c.state==='happy'&&tick%30===0){add(c.x-12,46,'h');if(tick%60===0)purr()}if(--c.timer<=0)finish()}
else if(c.state==='sleep'){if(tick%40===0)txt(c.x-c.fl*8,YB-88*cur.sy-4,'z')}
else if(c.state==='idle'&&aiOn&&rnd()<.0008)think();
toys();const T=target();for(const k in cur)cur[k]+=(T[k]-cur[k])*.18;EY=T.eye;EM=T.mo;c.rf=1;
if(c.state==='roll'){const p=1-c.timer/70,ph=p*Math.PI*2;cur.sx=Math.max(.12,Math.abs(Math.cos(ph)));c.rf=Math.cos(ph)<0?-1:1;cur.dy=-Math.sin(p*Math.PI)*5}
draw()}
function ai(){const c=cat,n=night();if(!aiOn)return;
if(c.state==='sleep'){if(!n&&S.energy>=95){c.state='idle';ask('☀️')}return}
if(c.state!=='idle')return;
if(S.litter<20)return goto(50,'litter');
if((n&&Date.now()>c.noSleep)||S.energy<15)return goto(38,'sleep');
if(c.cool>0){c.cool--;return}
if(S.food<30){if(bowl)return goto(29,'eat');return ask('🍗')}
if(S.love<35)return ask('💗');if(S.clean<30)return ask('✨')}
const HS=[['🍗','food'],['💗','love'],['✨','clean'],['🚽','litter'],['⚡','energy']];
$('#hud').innerHTML=HS.map((h,i)=>`<div class="m">${h[0]}<div class="bar"><i id="m${i}"></i></div></div>`).join('');
function hud(){HS.forEach((h,i)=>{const v=S[h[1]],e=$('#m'+i);e.style.width=v+'%';e.style.background=v<25?'#e0384e':v<50?'#f0b429':'#5bc85b'})}
setInterval(()=>{const sl=cat.state==='sleep';S.food-=.35*(sl?.4:1);S.love-=.25;S.clean-=.12;S.litter-=.2;S.energy+=sl?2.2:-.1;
for(const k in S)S[k]=Math.max(0,Math.min(100,S[k]));hud();ai();
const h=hour(),d=new Date();lab=(night()?'☾ ':'☼ ')+(tmode?String(h).padStart(2,'0')+':00':d.toTimeString().slice(0,5))},1000);
// input
const pos=e=>{const b=cv.getBoundingClientRect();return{x:(e.clientX-b.left)/b.width*W,y:(e.clientY-b.top)/b.height*H}};
function hitU(p){const sy=cur.sy,top=YB+cur.dy-88*sy,u=Math.floor((p.x-cat.x)*cat.fl/cur.sx+24),v=Math.floor((p.y-top)/sy);
if(!A||u<0||u>=48||v<0||v>=88||!A[(v*48+u)*4+3])return null;return{u,v}}
function brushAt(p){if(!hitU(p))return;S.clean=Math.min(100,S.clean+1.3);S.love=Math.min(100,S.love+.25);cat.bt=8;if(tick%5===0){add(p.x,p.y,'s',-.3);beep(1200+rnd()*500,.03,.04)}hud()}
cv.addEventListener('pointerdown',e=>{ac();const p=pos(e);ptr=p;down=true;if(brush){brushAt(p);return}if(wandOn){wand={on:true,fx:p.x,fy:p.y,lx:wand?wand.lx:p.x,ly:wand?wand.ly:p.y,v:0};return}if(ballOn&&!hitU(p)){ball={x:p.x,y:p.y,vx:0,vy:0,held:false,drag:true};return}
const h=hitU(p);if(h)touch(h,p);else if(!['sleep','eat','litter','roll','sniff','flehmen'].includes(cat.state)){cat.lk=p.x<cat.x?-2.5:2.5;setTimeout(()=>cat.lk=0,2000);goto(p.x,null)}});
cv.addEventListener('pointermove',e=>{ptr=pos(e);if(brush&&down)brushAt(ptr);if(wand&&wand.on){wand.fx=ptr.x;wand.fy=ptr.y}if(ball&&ball.drag){ball.vx=(ptr.x-ball.x)*.7;ball.vy=(ptr.y-ball.y)*.7;ball.x=ptr.x;ball.y=ptr.y}});
cv.addEventListener('pointerleave',()=>ptr=null);addEventListener('pointerup',()=>{down=false;if(wand)wand.on=false;if(ball)ball.drag=false});
$('#bF').onclick=()=>{ac();if(S.food>90){say('🙅',60);return}bowl=true;goto(29,'eat')};
$('#bL').onclick=()=>{ac();if(S.litter>75){say('🙅',60);return}goto(50,'litter')};
$('#bS').onclick=()=>{ac();goto(38,'sleep')};
$('#bB').onclick=e=>{brush=!brush;e.currentTarget.classList.toggle('on',brush)};
$('#bT').onclick=e=>{tmode=(tmode+1)%3;e.currentTarget.innerHTML='🌓<br>'+['Auto','Día','Noche'][tmode]};
$('#bR').onclick=()=>{ac();if(['sleep','eat','litter','sniff','flehmen'].includes(cat.state))return;cat.state='roll';cat.timer=70};
$('#bO').onclick=smell;$('#bC').onclick=callName;
$('#bY').onclick=e=>{ballOn=!ballOn;wandOn=false;wand=null;if(!ballOn)ball=null;$('#bW').classList.remove('on');e.currentTarget.classList.toggle('on',ballOn);if(ballOn){ac();say('🧶',70);chirp()}};
$('#bW').onclick=e=>{wandOn=!wandOn;ballOn=false;ball=null;$('#bY').classList.remove('on');if(!wandOn)wand=null;e.currentTarget.classList.toggle('on',wandOn);if(wandOn){ac();say('👀',70)}};
$('#bP').onclick=()=>{ac();skinI=(skinI+1)%8;buildSkin();say(["😺","🧡","🩶","🤍","🐈‍⬛","🐈","😻","🐯"][skinI],65);chirp()};
$('#bH').onclick=()=>{ac();hI=(hI+1)%7;say(["😺","🎉","👑","🎀","🤠","🎩","🧢"][hI],60);chirp()};
$('#bK').onclick=()=>{ac();sI=(sI+1)%8;shirt();say(["😺","❤️","💙","💚","💜","🧡","🩵","💗"][sI],60);chirp()};
$('#bD').onclick=()=>{ac();toyI=(toyI+1)%5;say(["🧶","🔵","🟡","🟣","🟢"][toyI],70);chirp()};
$('#bI').onclick=e=>{aiOn=!aiOn;e.currentTarget.innerHTML='🧠<br>IA: '+(aiOn?'sí':'no')};

// === CULOGORDO V2: mascota persistente y con rutina propia ===
const CG_SAVE='culogordo_v2_save';
const cgBond={ear:0,face:0,whiskers:0,paw:0,belly:0,back:0,body:0,lastPart:'',lastAt:0};
function cgRemember(part){
 cgBond[part]=(cgBond[part]||0)+1;cgBond.lastPart=part;cgBond.lastAt=Date.now();
 if(cgBond[part]>=5&&part!=='paw'&&part!=='ear'&&rnd()<.35){say(part==='belly'?'😻':part==='face'?'😽':'😺',45);purr(.45)}
}
let cgLastLife=Date.now(), cgNextQuirk=Date.now()+18000;
function cgLoad(){
  try{
    const raw=localStorage.getItem(CG_SAVE); if(!raw)return;
    const d=JSON.parse(raw); if(!d||!d.needs)return;
    if(d.bond&&typeof d.bond==='object')for(const k of Object.keys(cgBond))if(Number.isFinite(d.bond[k]))cgBond[k]=d.bond[k];
    for(const k of ['food','love','clean','litter','energy']) if(Number.isFinite(d.needs[k])) S[k]=Math.max(0,Math.min(100,d.needs[k]));
    if(Number.isFinite(d.x)) cat.x=Math.max(28,Math.min(50,d.x));
    if(Number.isFinite(d.fl)) cat.fl=d.fl<0?-1:1;
    if(Number.isFinite(d.hat)) hI=(d.hat+7)%7;
    if(Number.isFinite(d.shirt)) sI=(d.shirt+8)%8;
    if(Number.isFinite(d.skin)) skinI=(d.skin+8)%8;
    if(Number.isFinite(d.toy)) toyI=(d.toy+5)%5;
    const elapsed=Math.max(0,Math.min(86400000,Date.now()-(d.savedAt||Date.now())))/60000;
    // El tiempo pasa mientras la persona no juega, pero la mascota no se castiga de forma extrema.
    S.food=Math.max(0,S.food-elapsed*.12);
    S.love=Math.max(0,S.love-elapsed*.045);
    S.clean=Math.max(0,S.clean-elapsed*.025);
    S.litter=Math.max(0,S.litter-elapsed*.035);
    S.energy=Math.min(100,S.energy+elapsed*.10);
    if(elapsed>45){cat.state='idle';say('😺',70)}
  }catch(e){console.warn('No se pudo recuperar la partida',e)}
}
function cgSave(){
  try{localStorage.setItem(CG_SAVE,JSON.stringify({needs:S,bond:cgBond,x:cat.x,fl:cat.fl,hat:hI,shirt:sI,skin:skinI,toy:toyI,savedAt:Date.now()}))}catch(e){}
}
cgLoad();
buildSkin();
setInterval(cgSave,5000);
addEventListener('pagehide',cgSave);
document.addEventListener('visibilitychange',()=>{if(document.hidden)cgSave()});
// Pequeñas decisiones espontáneas: mira, bosteza, se acomoda o se acerca.
function cgLittleLife(){
  const now=Date.now();
  if(now<cgNextQuirk || cat.state!=='idle' || ballOn || wandOn)return;
  cgNextQuirk=now+18000+Math.random()*22000;
  const r=Math.random();
  if(r<.22){cat.fl=Math.random()<.5?-1:1;say('👀',45)}
  else if(r<.42){cat.state='stretch';cat.timer=60}
  else if(r<.62){cat.state='groom';cat.timer=90}
  else if(r<.78){say('💤',45);cat.state='yawn';cat.timer=50}
  else if(r<.90){goto(29+Math.random()*20,null,.55)}
  else {cat.lk=(Math.random()<.5?-1:1)*2;setTimeout(()=>cat.lk=0,1800)}
}
setInterval(cgLittleLife,1000);

buildSkin();hud();setInterval(step,33);
</script></body></html>
